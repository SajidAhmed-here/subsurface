
name: docs

on:
  push:
    branches:
      - main
      - fixing-docs
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  docs:
    name: Deploy docs
    runs-on: ubuntu-latest

    env:
      DISPLAY: ':99.0'
      PYVISTA_OFF_SCREEN: 'True'
      ALLOW_PLOTTING: 'true'
      SHELLOPTS: 'errexit:pipefail'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch git tags
        run: git fetch origin 'refs/tags/*:refs/tags/*'

      - name: Setup Headless Display
        run: |
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          # Restore the original dependency installation commands here.
          echo "Replace this with the project's actual installation commands"

      - name: Generate Docs & Check Links
        working-directory: docs/
        run: make html

      # Keep the original publishing step only when you are ready
      # to test deployment and have configured its required secret.
