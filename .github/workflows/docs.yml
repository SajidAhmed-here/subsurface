name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.10 tests
    runs-on: ubuntu-latest
    env:
      PYVISTA_OFF_SCREEN: "true"
      ALLOW_PLOTTING: "true"
      PYTHONPATH: tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            setup.py
            requirements/*.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e . -r requirements/requirements_opt.txt -r requirements/requirements_geospatial.txt -r requirements/requirements_wells.txt pytest pytest-cov

      - name: Check dependency consistency
        run: python -m pip check

      - name: Run tests
        # Exclude tests needing private .env datasets and two known structured-grid failures.
        run: >-
          xvfb-run -a python -m pytest tests
          --cov=subsurface
          --cov-report=term-missing
          --ignore=tests/test_io/test_lines/test_lines_I.py
          --ignore=tests/test_io/test_combined/test_read_OMF.py
          --ignore=tests/test_io/test_combined/test_read_OMF_to_well.py
          --ignore=tests/test_io/test_meshes/test_read_obj.py
          --deselect=tests/test_io/test_meshes/test_read_topography.py::test_read_topography_from_tif
          --deselect=tests/test_visualization/test_pyvista.py::test_pyvista_structured_grid
